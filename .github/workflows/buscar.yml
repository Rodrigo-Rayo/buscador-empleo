# Busca ofertas para los perfiles publicados y activos (published y no paused en src/profiles.ts) y publica la
# página de cada persona en GitHub Pages (las pausadas siguen en línea con sus últimas ofertas):
#   Gabi → https://rodrigo-rayo.github.io/buscador-empleo/
#   Amy  → https://rodrigo-rayo.github.io/buscador-empleo/amy/
#   Marilyn → https://rodrigo-rayo.github.io/buscador-empleo/marilyn/
# Lunes, miércoles y viernes; el cron va en UTC y GitHub suele retrasarlo varias horas.
# También se puede lanzar a mano: pestaña Actions > "Buscar ofertas" > Run workflow.
name: Buscar ofertas

on:
  schedule:
    - cron: '0 5 * * 1,3,5'
  workflow_dispatch:
    inputs:
      buscar:
        description: 'Buscar ofertas nuevas (gasta créditos de Serper). Desmarcado: solo regenera las páginas'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: buscar
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Solo perfiles con página publicada: si en local se reactiva otro (el de desarrollo...), aquí no se busca
      - name: Buscar ofertas nuevas
        if: github.event_name == 'schedule' || inputs.buscar
        run: node dist/index.js --publicados
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      # Sin créditos: también regenera las páginas de los perfiles pausados
      - name: Regenerar las páginas
        run: node dist/ver.js --sin-abrir

      # Las ofertas guardadas se suben al repositorio: así la siguiente búsqueda sabe cuáles ya conoce
      - name: Guardar ofertas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofertas-gabi.json ofertas-amy.json ofertas-marilyn.json estadisticas.json
          git diff --cached --quiet || git commit -m "chore: ofertas del $(date +%F)"
          git push

      - name: Preparar las páginas
        run: |
          mkdir -p _site/amy _site/marilyn
          cp ofertas-gabi.html _site/index.html
          cp ofertas-amy.html _site/amy/index.html
          cp ofertas-marilyn.html _site/marilyn/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
